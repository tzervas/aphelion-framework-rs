# Commitizen configuration (commitizen-tools).
# Install (optional): pip install commitizen  OR  uv tool install commitizen
# This file is valid without the CLI: agents and humans follow docs/VERSIONING.md for the
# same rules. Canonical peer reference: tzervas/gha-runner-ctl/.cz.toml
#
# ============================================================================
# WHY `major_version_zero` IS DELIBERATELY ABSENT HERE
# ============================================================================
# The fleet standard sets `major_version_zero = true` everywhere, because nearly every
# repo in the fleet is 0.x and that key is what keeps it there.
#
# THIS REPO IS THE EXCEPTION, AND THE KEY MUST NOT BE ADDED.
#
# aphelion-core and aphelion-macros are PUBLISHED ON crates.io AT 1.2.10. Real dependents
# resolve them. `major_version_zero` does not stop applying once you pass 1.0 -- it pins
# the major FOREVER, and it does so by silently demoting breaking changes to MINOR bumps.
# Measured, on a fixture at version 1.2.10:
#
#     BREAKING @1.2.10, major_version_zero = true   ->  bump: 1.2.10 -> 1.3.0   (MINOR)
#     BREAKING @1.2.10, major_version_zero absent   ->  bump: 1.2.10 -> 2.0.0   (MAJOR)
#
# A cargo dependent on `aphelion-core = "1.2"` accepts anything `>=1.2.0, <2.0.0`. Shipping
# a breaking change as 1.3.0 therefore lands it silently in every consumer's next build.
# That is a semver violation against published artifacts that cannot be unpublished.
#
# At 1.x, MAJOR is the breaking position again -- and a major bump still requires explicit
# human authorization. No agent may cut 2.0.0 any more than it may cut 1.0.0.
# ============================================================================

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.2.10"
tag_format = "v$version"
version_scheme = "semver"

# Keep these lockstep on every release bump (see docs/VERSIONING.md § Version files).
# The `version = ` pattern covers all three occurrences of the workspace version in
# Cargo.toml: [workspace.package] version, and the two internal [workspace.dependencies]
# pins for aphelion-macros and aphelion-core. Third-party pins on the same lines (serde
# "1.0", tokio "1") are untouched -- cz only replaces the literal current version string.
# Verified with a real bump: 1.2.10 -> 2.0.0 moved exactly those three and nothing else.
#
# The per-crate manifests under crates/*/Cargo.toml all use `version = { workspace = true }`
# and inherit, so they carry no copy of their own and need no entry here.
version_files = [
    "Cargo.toml:version = ",
]

update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
